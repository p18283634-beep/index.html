<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina di Prova</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f6d365, #fda085);
        color: #222;
      }
      .box {
        background: rgba(255,255,255,0.85);
        padding: 40px 60px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2.2rem;
      }
      p {
        margin: 0;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Pagina pronta</h1>
      <p>Il tuo file HTML è stato creato correttamente.</p>
    </div>
  </body>
</html>
