<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benvenuto</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #312e81;
        --accent: #f59e0b;
        --accent2: #f97316;
        --text: #e5e7eb;
        --muted: #cbd5e1;
        --card: rgba(15, 23, 42, 0.7);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
      }

      .container {
        width: min(90%, 900px);
        padding: 32px 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
        backdrop-filter: blur(6px);
      }

      .badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        margin: 0 0 14px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .cta {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #111827;
      }

      .button.secondary {
        background: rgba(255,255,255,0.06);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.12);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="badge">GitHub Pages</div>
        <h1>Benvenuto nel tuo sito</h1>
        <p>
          Questa è una pagina pronta da condividere su Telegram e da pubblicare online.
          Puoi personalizzarla con testo, immagini, link e contenuti del tuo progetto.
        </p>

        <div class="cta">
          <a class="button primary" href="https://github.com/p18283634-beep/index.html" target="_blank" rel="noreferrer">Vedi repo</a>
          <a class="button secondary" href="https://github.com/p18283634-beep/index.html/settings/pages" target="_blank" rel="noreferrer">Abilita Pages</a>
        </div>
      </div>
    </div>
  </body>
</html>
